services:
  - type: web
    name: myapp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_CONNECTION_STRING
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
